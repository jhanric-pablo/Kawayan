<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawayan AI - Philippine SME Marketing</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>try{var t=localStorage.getItem('kawayan_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

    <!-- Fonts: Plus Jakarta Sans (UI/body) + Space Grotesk (Display/Brand) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* ═══════════════════════════════════════════════════════════════
         KAWAYAN AI — MODERN DESIGN SYSTEM v2.0
         Glass Morphism · Inter Typography · Elevation System
         ═══════════════════════════════════════════════════════════════ */

      /* ═══════════════════════════════════════════════════════════════
         KAWAYAN — DESIGN SYSTEM v3  ·  "Studio"
         Crisp editorial workspace · solid surfaces · hairline borders
         Forest green · sage · warm paper · one calm elevation ramp
         ═══════════════════════════════════════════════════════════════ */
      :root {
        /* Brand — forest green + sage (the Kawayan signature, kept) */
        --kw-green:        #2B5748;
        --kw-green-light:  #37715A;
        --kw-green-pale:   #E7F0EB;
        --kw-sage:         #9CB080;
        --kw-sage-light:   #C2D6B6;
        --kw-forest:       #15352A;

        /* Surface — Rice Paper & Forest (default): warm canvas, white cards, stone hairlines */
        --bg:              #F7F6F2;
        --bg-alt:          #EFEDE7;
        --fg:              #151D19;
        --fg-muted:        #606964;
        --fg-subtle:       #8B918D;

        /* Glass (overlays / a11y widget) */
        --glass-bg:        rgba(255,255,255,0.85);
        --glass-bg-strong: rgba(255,255,255,0.96);
        --glass-border:    rgba(15,26,22,0.08);
        --glass-shadow:    0 12px 40px rgba(15,26,22,0.12);

        /* Cards */
        --card:            #FFFFFF;
        --card-hover:      #FAF9F6;
        --border:          #E6E4DD;
        --border-strong:   #D8D5CC;

        /* Semantic. --primary is the accent for links, lines and selections;
           --accent-rgb is the same colour as channels, for Tailwind's brand/<alpha>. */
        --primary:         #1A6B4F;
        --primary-hover:   #155A42;
        --accent-rgb:      26 107 79;
        --on-accent:       #FFFFFF;
        /* Main buttons ("Create post", "Plan month") */
        --primary-accent:       #153E31;
        --primary-accent-hover: #103227;
        --primary-accent-fg:    #FFFFFF;
        /* Brand badges and status pills */
        --badge-bg:        #E8F3EE;
        --badge-text:      #1B4D3E;
        --badge-border:    #CDE5D8;
        /* Today's column on the timeline */
        --today-highlight: rgba(16,185,129,0.08);
        --secondary:       #5E7F63;
        --accent:          #9CB080;
        --success:         #17935A;
        --warning:         #D97A1E;
        --danger:          #D14343;
        --ring:            rgba(26,107,79,0.24);

        /* Elevation — crisp, tight, modern */
        --shadow-xs:  0 1px 3px rgba(0,0,0,0.04);
        --shadow-sm:  0 1px 2px rgba(16,32,26,0.05), 0 2px 6px -1px rgba(16,32,26,0.07);
        --shadow:     0 2px 4px -1px rgba(16,32,26,0.06), 0 6px 16px -4px rgba(16,32,26,0.10);
        --shadow-md:  0 4px 8px -2px rgba(16,32,26,0.08), 0 12px 28px -8px rgba(16,32,26,0.14);
        --shadow-lg:  0 8px 16px -4px rgba(16,32,26,0.10), 0 24px 48px -12px rgba(16,32,26,0.18);
        --shadow-xl:  0 16px 32px -8px rgba(16,32,26,0.14), 0 40px 72px -16px rgba(16,32,26,0.24);

        /* Typography */
        --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-display: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif;

        /* Radius — crisp product scale */
        --r-sm:   6px;
        --r:      9px;
        --r-md:   12px;
        --r-lg:   14px;
        --r-xl:   18px;
        --r-2xl:  24px;
        --r-pill: 9999px;
      }

      /* Cool Slate & Cobalt: slate-900 buttons, cobalt accents */
      :root[data-theme='cool-slate']:not(.dark) {
        --bg: #F8FAFC; --bg-alt: #F1F5F9; --card: #FFFFFF; --card-hover: #F8FAFC;
        --fg: #0F172A; --fg-muted: #475569; --fg-subtle: #7C889B;
        --border: #E2E8F0; --border-strong: #CBD5E1;
        --primary: #2563EB; --primary-hover: #1D4ED8; --accent-rgb: 37 99 235; --on-accent: #FFFFFF;
        --ring: rgba(37,99,235,0.25); --kw-green-pale: #EFF6FF;
        --primary-accent: #0F172A; --primary-accent-hover: #1E293B; --primary-accent-fg: #FFFFFF;
        --badge-bg: #EFF6FF; --badge-text: #1E40AF; --badge-border: #BFDBFE;
        --today-highlight: rgba(37,99,235,0.08);
      }

      /* Oatmeal & Terracotta: earthy, warm bronze */
      :root[data-theme='terracotta']:not(.dark) {
        --bg: #FDFBF7; --bg-alt: #F5F0E8; --card: #FFFFFF; --card-hover: #FCFAF6;
        --fg: #1C1917; --fg-muted: #57534E; --fg-subtle: #8C847D;
        --border: #E7E5E4; --border-strong: #D6D3D1;
        --primary: #C2410C; --primary-hover: #9A3412; --accent-rgb: 194 65 12; --on-accent: #FFFFFF;
        --ring: rgba(194,65,12,0.22); --kw-green-pale: #FFF1E6;
        --primary-accent: #C2410C; --primary-accent-hover: #9A3412; --primary-accent-fg: #FFFFFF;
        --badge-bg: #FFF1E6; --badge-text: #9A3412; --badge-border: #FED7AA;
        --today-highlight: rgba(194,65,12,0.08);
      }

      /* Dark: deep bamboo emerald on near-black zinc */
      .dark {
        --bg:              #0B0F0E;
        --bg-alt:          #111715;
        --fg:              #E8EDEA;
        --fg-muted:        rgba(232,237,234,0.62);
        --fg-subtle:       rgba(232,237,234,0.40);

        --glass-bg:        rgba(18,24,22,0.88);
        --glass-bg-strong: rgba(18,24,22,0.97);
        --glass-border:    rgba(16,185,129,0.14);
        --glass-shadow:    0 12px 40px rgba(0,0,0,0.55);

        --card:            #121816;
        --card-hover:      #18201D;
        --border:          #1F2925;
        --border-strong:   #2A3833;

        --kw-green:        #059669;
        --kw-green-light:  #10B981;
        --kw-green-pale:   rgba(6,78,59,0.40);
        --kw-sage:         #10B981;
        --kw-sage-light:   #34D399;

        --primary:         #10B981;
        --primary-hover:   #34D399;
        --accent-rgb:      16 185 129;
        --on-accent:       #04140F;
        --secondary:       #8AA68D;
        --success:         #10B981;
        --ring:            rgba(16,185,129,0.34);
        --primary-accent:       #10B981;
        --primary-accent-hover: #34D399;
        --primary-accent-fg:    #04140F;
        --badge-bg:        rgba(6,78,59,0.40);
        --badge-text:      #34D399;
        --badge-border:    rgba(6,95,70,0.55);
        --today-highlight: rgba(16,185,129,0.12);

        --shadow-xs:  0 1px 2px rgba(0,0,0,0.35);
        --shadow-sm:  0 1px 2px rgba(0,0,0,0.35), 0 2px 6px -1px rgba(0,0,0,0.40);
        --shadow:     0 2px 4px -1px rgba(0,0,0,0.40), 0 6px 16px -4px rgba(0,0,0,0.50);
        --shadow-md:  0 4px 8px -2px rgba(0,0,0,0.45), 0 12px 28px -8px rgba(0,0,0,0.55);
        --shadow-lg:  0 8px 16px -4px rgba(0,0,0,0.50), 0 24px 48px -12px rgba(0,0,0,0.60);
        --shadow-xl:  0 16px 32px -8px rgba(0,0,0,0.55), 0 40px 72px -16px rgba(0,0,0,0.65);
      }

      /* ── Reset & Base ───────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-ui);
        font-size: 0.9375rem;
        line-height: 1.6;
        font-weight: 400;
        letter-spacing: -0.006em;
        background-color: var(--bg);
        color: var(--fg);
        overflow-x: hidden;
      }

      /* Soft ambient wash */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background:
          radial-gradient(110% 70% at 100% 0%, rgba(43,87,72,0.045), transparent 60%),
          radial-gradient(90% 60% at 0% 100%, rgba(156,176,128,0.05), transparent 60%);
      }
      .dark body::before {
        background:
          radial-gradient(110% 70% at 100% 0%, rgba(43,87,72,0.18), transparent 60%),
          radial-gradient(90% 60% at 0% 100%, rgba(156,176,128,0.06), transparent 60%);
      }

      /* ── Typography ─────────────────────────────────────────────── */
      .font-display   { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.015em; }
      .font-ui        { font-family: var(--font-ui); }

      h1, .h1 { font-family: var(--font-display); font-size: clamp(2rem, 1.35rem + 2.6vw, 3.1rem); font-weight: 700; line-height: 1.06; letter-spacing: -0.022em; }
      h2, .h2 { font-family: var(--font-display); font-size: clamp(1.55rem, 1.2rem + 1.5vw, 2.1rem); font-weight: 700; line-height: 1.13; letter-spacing: -0.02em; }
      h3, .h3 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; line-height: 1.28; letter-spacing: -0.015em; }
      h4, .h4 { font-size: 1.02rem; font-weight: 650; line-height: 1.42; letter-spacing: -0.01em; }
      h5, .h5 { font-size: 0.9rem; font-weight: 650; line-height: 1.5; letter-spacing: -0.006em; }

      .text-label  { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
      .text-caption{ font-size: 0.8125rem; line-height: 1.5; }
      .text-body   { font-size: 0.9375rem; line-height: 1.65; }
      .text-body-lg{ font-size: 1.0625rem; line-height: 1.7; }

      .text-gradient {
        background: linear-gradient(115deg, #2B5748 0%, #4F9878 55%, #9CB080 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .dark .text-gradient {
        background: linear-gradient(115deg, #A9C08D 0%, #7FB79C 50%, #C2D6B6 100%);
        -webkit-background-clip: text;
        background-clip: text;
      }

      /* ── Glassmorphism System ───────────────────────────────────── */

      /* Frosted surfaces — light blur, crisp hairline */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(14px) saturate(1.3);
        -webkit-backdrop-filter: blur(14px) saturate(1.3);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
      }
      .glass-strong {
        background: var(--glass-bg-strong);
        backdrop-filter: blur(16px) saturate(1.4);
        -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .glass-subtle {
        background: var(--bg-alt);
        border: 1px solid var(--border);
      }
      .dark .glass { background: var(--glass-bg); border-color: var(--border); }
      .dark .glass-strong { background: var(--glass-bg-strong); border-color: var(--border); }
      .dark .glass-subtle { background: var(--bg-alt); border-color: var(--border); }

      .glass-card {
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        border-radius: var(--r-lg);
      }
      .dark .glass-card { background: var(--card); border-color: var(--border); }

      /* Top navigation bar */
      .glass-panel {
        background: color-mix(in srgb, var(--bg) 78%, transparent);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        border-bottom: 1px solid var(--border);
      }
      .dark .glass-panel {
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        border-bottom: 1px solid var(--border);
      }

      /* ── Surface Cards ──────────────────────────────────────────── */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-xs);
        transition: box-shadow 0.22s ease, transform 0.22s ease, border-color 0.22s ease;
      }
      .card-hover:hover {
        box-shadow: var(--shadow-md);
        border-color: var(--border-strong);
        transform: translateY(-2px);
      }
      .card-interactive {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      }
      .card-interactive:hover {
        background: var(--card-hover);
        border-color: var(--border-strong);
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      /* Consistent page header for every app screen */
      .page-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.75rem;
      }
      .page-head__title {
        font-family: var(--font-display);
        font-size: clamp(1.5rem, 1.2rem + 1.1vw, 1.95rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--fg);
        line-height: 1.12;
      }
      .page-head__sub {
        font-size: 0.875rem;
        color: var(--fg-muted);
        margin-top: 0.35rem;
        max-width: 60ch;
      }

      /* Section container inside screens */
      .surface {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-xs);
      }
      .surface-pad { padding: 1.25rem 1.5rem; }

      /* ── Buttons ────────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: var(--font-ui);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.006em;
        line-height: 1;
        padding: 0.66rem 1.2rem;
        border-radius: var(--r-pill);
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, transform 0.14s cubic-bezier(0.34,1.4,0.64,1), color 0.16s ease;
        white-space: nowrap;
        border: 1px solid transparent;
        outline: none;
      }
      .btn:hover:not(:disabled) { transform: translateY(-1px); }
      .btn:active:not(:disabled) { transform: translateY(0) scale(0.985); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .btn-primary {
        background: var(--primary-accent);
        color: var(--primary-accent-fg);
        box-shadow: var(--shadow-xs), inset 0 1px 0 rgba(255,255,255,0.12);
      }
      .btn-primary:hover:not(:disabled) { background: var(--primary-accent-hover); box-shadow: 0 8px 22px -8px color-mix(in srgb, var(--primary-accent) 45%, transparent); }

      .btn-glass {
        background: var(--card);
        border-color: var(--border-strong);
        color: var(--fg);
        box-shadow: var(--shadow-xs);
      }
      .btn-glass:hover:not(:disabled) { background: var(--card-hover); border-color: var(--fg-subtle); }

      .btn-outline {
        background: transparent;
        border-color: var(--border-strong);
        color: var(--fg);
      }
      .btn-outline:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
        background: color-mix(in srgb, var(--primary) 7%, transparent);
      }

      .btn-ghost {
        background: transparent;
        color: var(--fg-muted);
      }
      .btn-ghost:hover:not(:disabled) { background: var(--bg-alt); color: var(--fg); }

      .btn-danger {
        background: transparent;
        border-color: color-mix(in srgb, var(--danger) 30%, transparent);
        color: var(--danger);
      }
      .btn-danger:hover:not(:disabled) {
        background: color-mix(in srgb, var(--danger) 8%, transparent);
        border-color: var(--danger);
      }

      .btn-sm { font-size: 0.8rem; padding: 0.45rem 0.9rem; }
      .btn-lg { font-size: 0.95rem; padding: 0.8rem 1.5rem; }

      /* Legacy alias — kept for older components */
      .organic-btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: var(--primary-accent);
        color: var(--primary-accent-fg);
        font-weight: 640;
        box-shadow: var(--shadow-xs), inset 0 1px 0 rgba(255,255,255,0.14);
        transition: background 0.16s ease, box-shadow 0.16s ease, transform 0.12s ease;
      }
      .organic-btn-primary:hover:not(:disabled) { background: var(--primary-accent-hover); }
      .organic-btn-primary:active:not(:disabled) { transform: scale(0.988); }

      /* ── Form Inputs ─────────────────────────────────────────────── */
      .input {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        background: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-md);
        padding: 0.62rem 0.9rem;
        color: var(--fg);
        width: 100%;
        transition: border-color 0.16s, box-shadow 0.16s, background 0.16s;
      }
      .input::placeholder { color: var(--fg-subtle); }
      .input:hover { border-color: var(--fg-subtle); }
      .input:focus {
        outline: none;
        border-color: var(--primary) !important;
        background: var(--card);
        box-shadow: 0 0 0 3px var(--ring) !important;
      }
      .dark .input { background: var(--bg-alt); border-color: var(--border-strong); }
      .dark .input:focus { background: var(--bg-alt); }

      /* Global input focus ring — one consistent style */
      input:focus, textarea:focus, select:focus {
        outline: none !important;
        box-shadow: 0 0 0 3px var(--ring) !important;
        border-color: var(--primary) !important;
      }

      /* ── Badge / Pill Labels ─────────────────────────────────────── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.28rem 0.62rem;
        border-radius: var(--r-pill);
        white-space: nowrap;
        border: 1px solid transparent;
      }
      .badge-green  { background: color-mix(in srgb, var(--kw-green) 10%, transparent); color: var(--kw-green); border-color: color-mix(in srgb, var(--kw-green) 22%, transparent); }
      .badge-sage   { background: color-mix(in srgb, var(--kw-sage) 18%, transparent);  color: #4A7055; border-color: color-mix(in srgb, var(--kw-sage) 34%, transparent); }
      .badge-amber  { background: color-mix(in srgb, var(--warning) 12%, transparent);  color: #B4620F; border-color: color-mix(in srgb, var(--warning) 26%, transparent); }
      .badge-red    { background: color-mix(in srgb, var(--danger) 10%, transparent);   color: #A83224; border-color: color-mix(in srgb, var(--danger) 24%, transparent); }
      .badge-blue   { background: rgba(24,119,242,0.1); color: #1a6ad4; border-color: rgba(24,119,242,0.24); }
      .dark .badge-green  { color: var(--kw-sage); }
      .dark .badge-sage   { color: #9CB080; }
      .dark .badge-amber  { color: #E8924A; }
      .dark .badge-red    { color: #E05A48; }

      /* ── Stat Cards ──────────────────────────────────────────────── */
      .stat-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 1.15rem 1.35rem;
        box-shadow: var(--shadow-xs);
        transition: box-shadow 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
      }
      .stat-card:hover {
        box-shadow: var(--shadow);
        transform: translateY(-2px);
        border-color: var(--border-strong);
      }

      /* ── Dividers ────────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: var(--border);
        border: none;
      }
      .divider-v {
        width: 1px;
        background: var(--border);
      }

      /* ── Dot Pattern ─────────────────────────────────────────────── */
      .dot-pattern {
        background-image: radial-gradient(circle, rgba(43,87,72,0.08) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .dot-pattern-dark {
        background-image: radial-gradient(circle, rgba(156,176,128,0.07) 1px, transparent 1px);
        background-size: 22px 22px;
      }

      /* ── Gradient Blobs ──────────────────────────────────────────── */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
        opacity: 0.08;
      }
      .blob-green  { background: #2B5748; }
      .blob-sage   { background: #9CB080; }
      .blob-emerald{ background: #34D399; opacity: 0.06; }

      /* ── Animations ──────────────────────────────────────────────── */
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.45; transform: scale(0.78); }
      }
      @keyframes float-gentle {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-10px); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% center; }
        100% { background-position:  200% center; }
      }
      @keyframes slide-up {
        0%   { opacity: 0; transform: translateY(18px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        0%   { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes scale-in {
        0%   { opacity: 0; transform: scale(0.93); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes spin-slow {
        to { transform: rotate(360deg); }
      }

      .animate-pulse-dot    { animation: pulse-dot 2.4s ease-in-out infinite; }
      .animate-float-gentle { animation: float-gentle 6s ease-in-out infinite; }
      .animate-shimmer {
        background: linear-gradient(90deg, transparent 0%, rgba(43,87,72,0.06) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: shimmer 2.5s ease-in-out infinite;
      }
      .animate-slide-up  { animation: slide-up 0.4s cubic-bezier(0.16,1,0.3,1) both; }
      .animate-fade-in   { animation: fade-in 0.3s ease both; }
      .animate-scale-in  { animation: scale-in 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
      .animate-spin-slow { animation: spin-slow 3s linear infinite; }

      /* Staggered animation helpers */
      .delay-100 { animation-delay: 100ms; }
      .delay-150 { animation-delay: 150ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-400 { animation-delay: 400ms; }
      .delay-500 { animation-delay: 500ms; }

      /* ── Scrollbar ───────────────────────────────────────────────── */
      ::-webkit-scrollbar         { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track   { background: transparent; }
      ::-webkit-scrollbar-thumb   { background: rgba(15,26,22,0.16); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(15,26,22,0.30); background-clip: content-box; }
      .dark ::-webkit-scrollbar-thumb       { background: rgba(162,183,152,0.20); background-clip: content-box; }
      .dark ::-webkit-scrollbar-thumb:hover { background: rgba(162,183,152,0.36); background-clip: content-box; }
      .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }

      /* ── Surface styles (legacy compat) ─────────────────────────── */
      .organic-surface {
        background: var(--card);
        border-color: var(--border);
      }
      .dark .organic-surface {
        background: var(--card);
        border-color: var(--border);
      }

      /* ── Global transition ───────────────────────────────────────── */
      *, *::before, *::after {
        transition-property: color, background-color, border-color, box-shadow, opacity;
        transition-duration: 160ms;
        transition-timing-function: ease;
      }
      button, a, [role="button"] {
        transition-property: color, background-color, border-color, box-shadow, opacity, transform;
        transition-duration: 160ms;
        transition-timing-function: cubic-bezier(0.34,1.1,0.64,1);
      }

      /* ── Navigation active indicator ────────────────────────────── */
      .nav-item-active {
        background: var(--card);
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-xs);
        color: var(--primary);
      }
      .dark .nav-item-active {
        background: color-mix(in srgb, var(--kw-green) 40%, transparent);
        border-color: transparent;
        color: var(--kw-sage-light);
      }

      /* ── Responsive helpers ──────────────────────────────────────── */
      @media (max-width: 640px) {
        .hide-mobile { display: none !important; }
      }
      @media (min-width: 641px) {
        .hide-desktop { display: none !important; }
      }

      /* ── Utility: visually-hidden (a11y) ─────────────────────────── */
      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border-width: 0;
      }

      /* ── Focus ring (keyboard navigation) ───────────────────────── */
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: var(--r-sm);
      }
      .dark :focus-visible { outline-color: var(--kw-sage); }

      /* ── Modal / overlay pattern ────────────────────────────────── */
      .kw-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(10,18,15,0.44);
        backdrop-filter: blur(6px) saturate(1.1);
        -webkit-backdrop-filter: blur(6px) saturate(1.1);
        animation: fade-in 0.18s ease both;
      }
      .kw-sheet {
        background: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-xl);
        animation: scale-in 0.22s cubic-bezier(0.16,1,0.3,1) both;
      }
      @media (prefers-reduced-motion: reduce) {
        .kw-overlay, .kw-sheet, .animate-slide-up, .animate-fade-in, .animate-scale-in { animation: none !important; }
      }
    </style>
  </head>
