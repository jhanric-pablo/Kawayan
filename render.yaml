services:
  - type: web
    name: kawayan-ai
    runtime: node
    plan: free
    region: singapore
    # --include=dev: vite, tsx, and typescript all live in devDependencies,
    # but NODE_ENV=production below makes plain `npm install` skip them —
    # and tsx is also what the start command needs at runtime.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT itself; server.js already reads process.env.PORT.

      # Supabase — Project Settings -> API in your Supabase dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TIMEOUT
        value: 24h

      # Email (password reset links, verification-approved notice) — sent via
      # Resend's HTTPS API, not SMTP, since Render's free plan blocks outbound
      # SMTP ports. Get a key at resend.com; no domain verification needed if
      # MAIL_FROM stays on their shared onboarding@resend.dev sender.
      - key: APP_URL
        sync: false # your Render URL, e.g. https://kawayan-ai.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Cloudflare Workers AI (post text and images)
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

      # Optional: Groq, tried before Cloudflare for faster text generation
      - key: GROQ_API_KEY
        sync: false

      # Payments (PayMongo) — sk_test_... for the sandbox, sk_live_... once activated
      - key: PAYMONGO_SECRET_KEY
        sync: false

      # Social auto-posting (Facebook/Instagram) via Zernio — key from zernio.com
      - key: ZERNIO_API_KEY
        sync: false

      - key: LOG_LEVEL
        value: info
